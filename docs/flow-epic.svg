<text x="365" y="38" class="lane" text-anchor="middle">bot</text>
<rect x="484" y="8" width="222" height="1534" rx="14" fill="rgba(156,201,180,.06)"/>
<text x="595" y="38" class="lane" text-anchor="middle">Orca ワーカー</text>
<rect x="714" y="8" width="222" height="1534" rx="14" fill="rgba(138,147,168,.06)"/>
<text x="825" y="38" class="lane" text-anchor="middle">GitHub</text>
<path d="M736,94 H365 V135" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="550.5" y="87" class="edge" text-anchor="middle">@</text>
<path d="M365,185 V201" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="266" y="197" class="edge" text-anchor="end">@</text>
<path d="M365,251 V267" fill="none" stroke="#E9A0C8" stroke-width="1.6" marker-end="url(#flow-epic-tiger)" opacity="0.9"/>
<text x="266" y="263" class="edge" text-anchor="end">セキュリティに触れるとき</text>
<path d="M276,292 H135 V333" fill="none" stroke="#FFC87C" stroke-width="1.6" marker-end="url(#flow-epic-moon)" opacity="0.9"/>
<text x="205.5" y="285" class="edge" text-anchor="middle">当たるときだけ</text>
<path d="M224,358 H365 V399" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="294.5" y="351" class="edge" text-anchor="middle">承認（無ければ飛ばす）</text>
<path d="M454,424 H595 V465" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="524.5" y="417" class="edge" text-anchor="middle">タスク登録・起動</text>
<path d="M595,515 V531" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="496" y="527" class="edge" text-anchor="end">エピックへ push</text>
<path d="M506,556 H365 V597" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="435.5" y="549" class="edge" text-anchor="middle">test(…) (RED) を報告</text>
<path d="M454,622 H595 V663" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="524.5" y="615" class="edge" text-anchor="middle">確かめたら起動</text>
<path d="M506,688 H365 V729" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="435.5" y="681" class="edge" text-anchor="middle">feat(…) (GREEN) を報告</text>
<path d="M454,754 H595 V795" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="524.5" y="747" class="edge" text-anchor="middle">確かめたら起動</text>
<path d="M595,845 V861" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="496" y="857" class="edge" text-anchor="end">check 緑で push</text>
<path d="M506,886 H365 V927" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="435.5" y="879" class="edge" text-anchor="middle">refactor(…) を報告</text>
<path d="M454,952 H595 V993" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
