<text x="480" y="1245" class="edge" text-anchor="middle">修正済み</text>
<path d="M365,1241 V1257" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="266" y="1253" class="edge" text-anchor="end">直すべき点なし</text>
<path d="M276,1282 H135 V1323" fill="none" stroke="#FFC87C" stroke-width="1.6" marker-end="url(#flow-epic-moon)" opacity="0.9"/>
<text x="205.5" y="1275" class="edge" text-anchor="middle">マージを依頼（SHA つき）</text>
<path d="M224,1348 H825 V1389" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="524.5" y="1341" class="edge" text-anchor="middle">マージ</text>
<path d="M825,1439 V1480 H454" fill="none" stroke="#B7C0D8" stroke-width="1.6" marker-end="url(#flow-epic-mist)" opacity="0.9"/>
<text x="815" y="1463.5" class="edge" text-anchor="end">pr_merged</text>
<path d="M694,470 h8 V1104 h-8" fill="none" stroke="#9CC9B4" stroke-width="1.2" opacity="0.7"/>
<text x="740" y="476" class="edge" text-anchor="start">ワーカーは bot ではない。</text>
<text x="740" y="493" class="edge" text-anchor="start">Conductor が Run の中で</text>
<text x="740" y="510" class="edge" text-anchor="start">起動する使い捨ての作業者。</text>
<text x="740" y="527" class="edge" text-anchor="start">worker_done を受けて次を起動し、</text>
<text x="740" y="544" class="edge" text-anchor="start">終わったら解放する。マージ後に</text>
<text x="740" y="561" class="edge" text-anchor="start">作業場所も Conductor が消す。</text>
<text x="740" y="692" class="edge" text-anchor="start">TDD の段は省略しない。</text>
<text x="740" y="709" class="edge" text-anchor="start">Sentinel の攻撃ケースも</text>
<text x="740" y="726" class="edge" text-anchor="start">RED で凍結する。</text>
<text x="740" y="743" class="edge" text-anchor="start">RED のあとテストは変えない</text>
<text x="740" y="760" class="edge" text-anchor="start">（変えるなら人の判断）。</text>
<text x="740" y="900" class="edge" text-anchor="start">方針を決めたら ADR に残す。</text>
<text x="740" y="917" class="edge" text-anchor="start">ADR の案があるエピックは</text>
<text x="740" y="934" class="edge" text-anchor="start">計画 PR で承認済みでも</text>
<text x="740" y="951" class="edge" text-anchor="start">設計の承認を求める。</text>
<text x="740" y="1226" class="edge" text-anchor="start">Sentinel の指摘も同じ往復。</text>
<text x="740" y="1243" class="edge" text-anchor="start">往復は 2 回まで。</text>
<text x="740" y="1260" class="edge" text-anchor="start">Update branch で SHA が</text>
<text x="740" y="1277" class="edge" text-anchor="start">変わったら通し直す</text>
<text x="740" y="1294" class="edge" text-anchor="start">（取り込みだけなら引き継ぎ）。</text>
<text x="595" y="56" class="edge" text-anchor="middle">Conductor が起動</text>
