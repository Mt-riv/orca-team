<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1550" width="960" height="1550" role="img" aria-labelledby="flow-epic-t flow-epic-d">
<title id="flow-epic-t">エピック 1 件の流れ</title>
<desc id="flow-epic-d">子 issue から、Intake の振り分け、Conductor の仕様化、Sentinel の設計のセキュリティレビュー、条件つきの人の設計承認、Run とエピックのブランチ作成、テスト設計、RED、GREEN、統合、REFACTOR とそれぞれの確認、クロスレビュー、PR 作成、Reviewer のレビューと修正の往復、Sentinel のマージ前のセキュリティレビュー、人のマージ、Conductor の片付けまでの流れ</desc>
<style>
.lane { font: 700 14px 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', 'Noto Sans CJK JP', Meiryo, sans-serif; fill: #B7C0D8; }
.title { font: 700 14px 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic', 'Noto Sans JP', 'Noto Sans CJK JP', Meiryo, sans-serif; fill: #FFFFF0; }
.sub { font: 400 11.5px 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Noto Sans CJK JP', Meiryo, sans-serif; fill: #B7C0D8; }
.edge { font: 500 11px 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Noto Sans CJK JP', Meiryo, sans-serif; fill: #B7C0D8; }
.tag { font: 700 10px 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', 'Noto Sans JP', 'Noto Sans CJK JP', Meiryo, sans-serif; fill: #181F33; letter-spacing: .06em; }
</style>
